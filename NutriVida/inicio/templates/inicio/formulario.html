{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriVida formulario</title>
    <link rel="stylesheet" href="{% static 'inicio/form_style.css' %}?v=1.0">
</head>
<body>
    <h1>Rellene este formulario</h1>

    <h2>Utilice solo el formato solicitado en cada pregunta, de lo contrario no se podra verificar.
    </h2>

    <form id="myform" method="get" action="{% url 'plan_semanal' %}">
        <label for="diet">Tipo de Dieta (Vegetariana, Vegana, Omnívora):</label>
        <input type="text" id="diet" name="diet" required>
        <br> 
        <label for="intolerances">Intolerancias: (Separadas por una coma)</label>
        <input type="text" id="intolerances" name="intolerances" required>
        <br>
        <label for="include_ingredients">Ingredientes a incluir:</label>
        <input type="text" id="include_ingredients" name="include_ingredients" required>
        <br>
        <label for="exclude_ingredients">Ingredientes a excluir:</label>
        <input type="text" id="exclude_ingredients" name="exclude_ingredients" required>
        <br>
        <label for="min_protein">Proteína mínima (g):</label>
        <input type="number" id="min_protein" name="min_protein" required>
        <label for="max_protein">Proteína máxima (g):</label>
        <input type="number" id="max_protein" name="max_protein" required>
        <br>
        <label for="min_carbs">Carbohidratos mínimos (g):</label>
        <input type="number" id="min_carbs" name="min_carbs" required>
        <label for="max_carbs">Carbohidratos máximos (g):</label>
        <input type="number" id="max_carbs" name="max_carbs" required>
        <br>
        <label for="min_cal">Calorías mínimas (g):</label>
        <input type="number" id="min_cal" name="min_cal" required>
        <label for="max_cal">Calorías máximas (g):</label>
        <input type="number" id="max_cal" name="max_cal" required>
        <br>
        <label for="min_sugar">Azúcar mínima (g):</label>
        <input type="number" id="min_sugar" name="min_sugar" required>
        <label for="max_sugar">Azúcar máxima (g):</label>
        <input type="number" id="max_sugar" name="max_sugar" required>
        <br>
        <button type="submit">Enviar</button>

    </form>
</body>
</html>
